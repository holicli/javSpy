<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavDB 首页影片</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f5f7fa;
            margin: 0;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        h2 {
            font-weight: 500;
            color: #1e293b;
            margin: 0;
            border-left: 5px solid #3b82f6;
            padding-left: 1rem;
        }
        .page-info {
            color: #64748b;
            font-size: 0.9rem;
        }
        .table-wrapper {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: auto;
            max-height: 75vh;
            border: 1px solid #e9eef2;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1380px;
        }
        th {
            background: #f1f5f9;
            color: #334155;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 1rem 0.8rem;
            white-space: nowrap;
            border-bottom: 1px solid #dde3e9;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            padding: 0.8rem;
            border-bottom: 1px solid #edf2f6;
            color: #1e293b;
            font-size: 0.9rem;
            vertical-align: middle;
        }
        tr:hover td {
            background-color: #fafcff;
        }
        .cover-cell {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70px;
            width: 50px;
        }
        .cover-img {
            width: 50px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            display: block;
            position: relative;
            z-index: 1;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
        }
        .cover-img:hover {
            transform: scale(3);
            transform-origin: center center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            z-index: 9999;
            border-radius: 8px;
        }
        .code {
            color: #3b82f6;
            font-weight: 600;
            white-space: nowrap;
        }
        .text-ellipsis {
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 500;
            white-space: nowrap;
        }
        .badge-db {
            background: #e0f2e7;
            color: #0e6245;
        }
        .badge-new {
            background: #dbeafe;
            color: #1e40af;
        }
        .badge-count {
            background: #eef1f4;
            color: #4b5565;
        }
        .detail-link {
            color: #3b82f6;
            text-decoration: none;
            white-space: nowrap;
        }
        .detail-link:hover {
            text-decoration: underline;
        }
        .loading-indicator {
            text-align: center;
            padding: 1.2rem;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px dashed #d4dfe9;
            background: #f9fbfd;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #cbd5e1;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .empty-row td {
            padding: 3rem;
            text-align: center;
            color: #94a3b8;
        }
        .error-tip {
            color: #b91c1c;
            background: #fee2e2;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            display: inline-block;
        }
        footer {
            margin-top: 20px;
            color: #6b7b8f;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>JavDB 首页影片</h2>
        <div class="page-info" id="pageInfo">第 1 页</div>
    </div>

    <div class="table-wrapper" id="scrollTableWrapper">
        <table>
            <thead>
            <tr>
                <th>封面</th>
                <th>番号</th>
                <th>标题</th>
                <th>演员</th>
                <th>时长</th>
                <th>日期</th>
                <th>片商</th>
                <th>系列</th>
                <th>类型</th>
                <th>磁力</th>
                <th>来源</th>
                <th>详情</th>
            </tr>
            </thead>
            <tbody id="movieBody">
            <tr class="empty-row"><td colspan="12">加载中，请稍候...</td></tr>
            </tbody>
        </table>
        <div id="loadMoreTrigger" class="loading-indicator">
            <span class="spinner"></span> 加载更多...
        </div>
    </div>

    <footer>
        <span>滚动到底部自动加载 javdb 首页下一页</span>
        <span id="totalInfo">已加载 0 部</span>
    </footer>
</div>

<script>
    (function () {
        const tbody = document.getElementById('movieBody');
        const loadMoreDiv = document.getElementById('loadMoreTrigger');
        const pageSpan = document.getElementById('pageInfo');
        const totalSpan = document.getElementById('totalInfo');
        const container = document.getElementById('scrollTableWrapper');

        let currentPage = 1;
        let isLoading = false;
        let hasMore = true;
        let total = 0;

        function esc(value) {
            if (value === null || value === undefined) return '';
            return String(value).replace(/[&<>"']/g, function (c) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
            });
        }

        function sourceBadge(source) {
            if (source === 'JAVDB') {
                return '<span class="badge badge-new">新抓取</span>';
            }
            return '<span class="badge badge-db">数据库</span>';
        }

        function renderRow(movie) {
            const cover = movie.coverUrl || 'https://via.placeholder.com/50x70?text=No+Img';
            const duration = movie.duration ? movie.duration + ' 分钟' : '—';
            const magnetCount = movie.magnetCount === null || movie.magnetCount === undefined
                    ? '—' : movie.magnetCount;
            const detailUrl = movie.detailUrl || '';
            return '<tr>' +
                '<td class="cover-cell"><img src="' + esc(cover) + '" alt="cover" class="cover-img" loading="lazy" onerror="this.src=\'https://via.placeholder.com/50x70?text=Error\'"></td>' +
                '<td class="code">' + esc(movie.code) + '</td>' +
                '<td class="text-ellipsis" title="' + esc(movie.title) + '">' + esc(movie.title) + '</td>' +
                '<td class="text-ellipsis" title="' + esc(movie.actors) + '">' + esc(movie.actors) + '</td>' +
                '<td>' + esc(duration) + '</td>' +
                '<td>' + esc(movie.releaseDate) + '</td>' +
                '<td class="text-ellipsis" title="' + esc(movie.studio) + '">' + esc(movie.studio) + '</td>' +
                '<td class="text-ellipsis" title="' + esc(movie.series) + '">' + esc(movie.series) + '</td>' +
                '<td class="text-ellipsis" title="' + esc(movie.genres) + '">' + esc(movie.genres) + '</td>' +
                '<td><span class="badge badge-count">' + esc(magnetCount) + '</span></td>' +
                '<td>' + sourceBadge(movie.source) + '</td>' +
                '<td>' + (detailUrl
                        ? '<a class="detail-link" href="' + esc(detailUrl) + '" target="_blank" rel="noopener">打开</a>'
                        : '—') + '</td>' +
                '</tr>';
        }

        function appendMovies(movies) {
            const emptyRow = tbody.querySelector('.empty-row');
            if (emptyRow) tbody.innerHTML = '';
            let html = '';
            movies.forEach(function (movie) {
                html += renderRow(movie);
            });
            tbody.insertAdjacentHTML('beforeend', html);
            total += movies.length;
            totalSpan.innerText = '已加载 ' + total + ' 部';
        }

        async function fetchPage(page) {
            if (isLoading || !hasMore) return;
            isLoading = true;
            loadMoreDiv.innerHTML = '<span class="spinner"></span> 正在加载第 ' + page + ' 页...';
            try {
                const response = await fetch('/javdb/home/movies?page=' + page, {
                    headers: {'Accept': 'application/json'}
                });
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                const result = await response.json();
                if (!result || result.success === false) {
                    throw new Error(result && result.message ? result.message : '接口返回失败');
                }
                const movies = Array.isArray(result.data) ? result.data : [];
                pageSpan.innerText = '第 ' + page + ' 页';
                if (movies.length === 0) {
                    hasMore = false;
                    loadMoreDiv.innerHTML = '已加载全部';
                    if (page === 1 && tbody.children.length <= 1) {
                        tbody.innerHTML = '<tr class="empty-row"><td colspan="12">暂无影片数据</td></tr>';
                    }
                    return;
                }
                appendMovies(movies);
                loadMoreDiv.innerHTML = '向下滚动加载更多...';
                setTimeout(checkAndLoadMoreIfNeeded, 150);
            } catch (error) {
                console.error('加载 javdb 首页失败:', error);
                loadMoreDiv.innerHTML = '<span class="error-tip">加载失败：' + esc(error.message) + '</span>';
            } finally {
                isLoading = false;
            }
        }

        function onScrollHandler() {
            if (!hasMore || isLoading) return;
            const scrollBottom = container.scrollHeight - container.scrollTop - container.clientHeight;
            if (scrollBottom < 80) {
                currentPage++;
                fetchPage(currentPage);
            }
        }

        function checkAndLoadMoreIfNeeded() {
            if (!hasMore || isLoading) return;
            if (container.scrollHeight <= container.clientHeight + 80) {
                currentPage++;
                fetchPage(currentPage);
            }
        }

        let scrollTimer;
        container.addEventListener('scroll', function () {
            if (scrollTimer) clearTimeout(scrollTimer);
            scrollTimer = setTimeout(onScrollHandler, 120);
        });

        fetchPage(1);
    })();
</script>
</body>
</html>
