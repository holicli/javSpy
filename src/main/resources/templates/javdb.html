<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavDB 首页影片</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f5f7fa;
            margin: 0;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        h2 {
            font-weight: 500;
            color: #1e293b;
            margin: 0;
            border-left: 5px solid #3b82f6;
            padding-left: 1rem;
        }
        .page-info {
            color: #64748b;
            font-size: 0.9rem;
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .toolbar label {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            color: #475569;
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
        }
        .export-btn {
            display: inline-flex;
            align-items: center;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.55rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .export-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .export-result {
            color: #334155;
            font-size: 0.9rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            word-break: break-all;
        }
        .check-cell {
            text-align: center;
        }
        .movie-check {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .table-wrapper {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow-x: hidden;
            overflow-y: auto;
            max-height: 75vh;
            border: 1px solid #e9eef2;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th {
            background: #f1f5f9;
            color: #334155;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.7rem 0.45rem;
            white-space: nowrap;
            border-bottom: 1px solid #dde3e9;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            padding: 0.6rem 0.45rem;
            border-bottom: 1px solid #edf2f6;
            color: #1e293b;
            font-size: 0.85rem;
            vertical-align: middle;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .col-check {
            width: 44px;
            text-align: center;
        }
        .col-cover {
            width: 58px;
        }
        .col-code {
            width: 115px;
        }
        .col-duration {
            width: 70px;
        }
        .col-date {
            width: 100px;
        }
        .col-emby {
            width: 72px;
        }
        .col-magnet {
            width: 64px;
        }
        .col-source {
            width: 82px;
        }
        .col-detail {
            width: 80px;
        }
        .row-export-btn {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.4rem 0.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .row-export-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        @media (max-width: 1200px) {
            .col-actors, .col-genres {
                display: none;
            }
        }
        @media (max-width: 900px) {
            .col-duration, .col-date, .col-source {
                display: none;
            }
        }
        tr:hover td {
            background-color: #fafcff;
        }
        .cover-cell {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70px;
            width: 50px;
        }
        .cover-img {
            width: 50px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            display: block;
            position: relative;
            z-index: 1;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
        }
        .cover-img:hover {
            /* 放大由 fixed 定位的封面预览层实现，避免被表格 overflow 裁剪 */
            opacity: 0.9;
        }
        .cover-preview {
            position: fixed;
            z-index: 10000;
            pointer-events: none;
            border-radius: 12px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.6);
            background: #fff;
            transform-origin: top left;
        }
        .code {
            color: #3b82f6;
            font-weight: 600;
            white-space: nowrap;
        }
        .text-ellipsis {
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 500;
            white-space: nowrap;
        }
        .badge-db {
            background: #e0f2e7;
            color: #0e6245;
        }
        .badge-new {
            background: #dbeafe;
            color: #1e40af;
        }
        .badge-count {
            background: #eef1f4;
            color: #4b5565;
        }
        .badge-emby-yes {
            background: #dcfce7;
            color: #15803d;
        }
        .badge-emby-no {
            background: #f1f5f9;
            color: #64748b;
        }
        .detail-link {
            color: #3b82f6;
            text-decoration: none;
            white-space: nowrap;
        }
        .detail-link:hover {
            text-decoration: underline;
        }
        .loading-indicator {
            text-align: center;
            padding: 1.2rem;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px dashed #d4dfe9;
            background: #f9fbfd;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #cbd5e1;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .empty-row td {
            padding: 3rem;
            text-align: center;
            color: #94a3b8;
        }
        .error-tip {
            color: #b91c1c;
            background: #fee2e2;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            display: inline-block;
        }
        footer {
            margin-top: 20px;
            color: #6b7b8f;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>JavDB 首页影片</h2>
        <div class="toolbar">
            <label><input type="checkbox" id="selectAllCheck"> 全选</label>
            <button type="button" class="export-btn" id="exportMagnetBtn">保存磁链</button>
            <span class="page-info" id="pageInfo">第 1 页</span>
        </div>
    </div>

    <div class="export-result" id="exportResult" style="display: none;"></div>

    <div class="table-wrapper" id="scrollTableWrapper">
        <table>
            <thead>
            <tr>
                <th class="col-check">选择</th>
                <th class="col-cover">封面</th>
                <th class="col-code">番号</th>
                <th class="col-title">标题</th>
                <th class="col-actors">演员</th>
                <th class="col-duration">时长</th>
                <th class="col-date">日期</th>
                <th class="col-emby">Emby</th>
                <th class="col-genres">类型</th>
                <th class="col-magnet">磁力</th>
                <th class="col-source">来源</th>
                <th class="col-detail">操作</th>
            </tr>
            </thead>
            <tbody id="movieBody">
            <tr class="empty-row"><td colspan="12">加载中，请稍候...</td></tr>
            </tbody>
        </table>
        <div id="loadMoreTrigger" class="loading-indicator">
            <span class="spinner"></span> 加载更多...
        </div>
    </div>

    <footer>
        <span>滚动到底部自动加载 javdb 首页下一页</span>
        <span id="totalInfo">已加载 0 部</span>
    </footer>
</div>

<script>
    (function () {
        const tbody = document.getElementById('movieBody');
        const loadMoreDiv = document.getElementById('loadMoreTrigger');
        const pageSpan = document.getElementById('pageInfo');
        const totalSpan = document.getElementById('totalInfo');
        const container = document.getElementById('scrollTableWrapper');
        const selectAllCheck = document.getElementById('selectAllCheck');
        const exportBtn = document.getElementById('exportMagnetBtn');
        const exportResult = document.getElementById('exportResult');

        let currentPage = 1;
        let isLoading = false;
        let hasMore = true;
        let total = 0;

        function esc(value) {
            if (value === null || value === undefined) return '';
            return String(value).replace(/[&<>"']/g, function (c) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
            });
        }

        function sourceBadge(source) {
            if (source === 'JAVDB') {
                return '<span class="badge badge-new">新抓取</span>';
            }
            return '<span class="badge badge-db">数据库</span>';
        }

        function embyBadge(exists) {
            return exists
                    ? '<span class="badge badge-emby-yes">存在</span>'
                    : '<span class="badge badge-emby-no">不存在</span>';
        }

        function renderRow(movie) {
            const cover = movie.coverUrl || 'https://via.placeholder.com/50x70?text=No+Img';
            const duration = movie.duration ? movie.duration + ' 分钟' : '—';
            const magnetCount = movie.magnetCount === null || movie.magnetCount === undefined
                    ? '—' : movie.magnetCount;
            return '<tr>' +
                '<td class="check-cell col-check"><input type="checkbox" class="movie-check" value="' + esc(movie.code) + '"></td>' +
                '<td class="cover-cell col-cover"><img src="' + esc(cover) + '" alt="cover" class="cover-img" loading="lazy" onerror="this.src=\'https://via.placeholder.com/50x70?text=Error\'"></td>' +
                '<td class="code col-code">' + esc(movie.code) + '</td>' +
                '<td class="text-ellipsis col-title" title="' + esc(movie.title) + '">' + esc(movie.title) + '</td>' +
                '<td class="text-ellipsis col-actors" title="' + esc(movie.actors) + '">' + esc(movie.actors) + '</td>' +
                '<td class="col-duration">' + esc(duration) + '</td>' +
                '<td class="col-date">' + esc(movie.releaseDate) + '</td>' +
                '<td class="col-emby">' + embyBadge(movie.embyExists) + '</td>' +
                '<td class="text-ellipsis col-genres" title="' + esc(movie.genres) + '">' + esc(movie.genres) + '</td>' +
                '<td class="col-magnet"><span class="badge badge-count">' + esc(magnetCount) + '</span></td>' +
                '<td class="col-source">' + sourceBadge(movie.source) + '</td>' +
                '<td class="col-detail">' + (movie.code
                        ? '<button type="button" class="row-export-btn" data-code="' + esc(movie.code) + '">保存磁链</button>'
                        : '—') + '</td>' +
                '</tr>';
        }

        function appendMovies(movies) {
            const emptyRow = tbody.querySelector('.empty-row');
            if (emptyRow) tbody.innerHTML = '';
            let html = '';
            movies.forEach(function (movie) {
                html += renderRow(movie);
            });
            tbody.insertAdjacentHTML('beforeend', html);
            total += movies.length;
            totalSpan.innerText = '已加载 ' + total + ' 部';
        }

        async function fetchPage(page) {
            if (isLoading || !hasMore) return;
            isLoading = true;
            loadMoreDiv.innerHTML = '<span class="spinner"></span> 正在加载第 ' + page + ' 页...';
            try {
                const response = await fetch('/javdb/home/movies?page=' + page, {
                    headers: {'Accept': 'application/json'}
                });
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                const result = await response.json();
                if (!result || result.success === false) {
                    throw new Error(result && result.message ? result.message : '接口返回失败');
                }
                const movies = Array.isArray(result.data) ? result.data : [];
                pageSpan.innerText = '第 ' + page + ' 页';
                if (movies.length === 0) {
                    hasMore = false;
                    loadMoreDiv.innerHTML = '已加载全部';
                    if (page === 1 && tbody.children.length <= 1) {
                        tbody.innerHTML = '<tr class="empty-row"><td colspan="12">暂无影片数据</td></tr>';
                    }
                    return;
                }
                appendMovies(movies);
                loadMoreDiv.innerHTML = '向下滚动加载更多...';
                setTimeout(checkAndLoadMoreIfNeeded, 150);
            } catch (error) {
                console.error('加载 javdb 首页失败:', error);
                loadMoreDiv.innerHTML = '<span class="error-tip">加载失败：' + esc(error.message) + '</span>';
            } finally {
                isLoading = false;
            }
        }

        function onScrollHandler() {
            if (!hasMore || isLoading) return;
            const scrollBottom = container.scrollHeight - container.scrollTop - container.clientHeight;
            if (scrollBottom < 80) {
                currentPage++;
                fetchPage(currentPage);
            }
        }

        function checkAndLoadMoreIfNeeded() {
            if (!hasMore || isLoading) return;
            if (container.scrollHeight <= container.clientHeight + 80) {
                currentPage++;
                fetchPage(currentPage);
            }
        }

        function selectedCodes() {
            const codes = [];
            tbody.querySelectorAll('.movie-check:checked').forEach(function (check) {
                codes.push(check.value);
            });
            return codes;
        }

        selectAllCheck.addEventListener('change', function () {
            const checked = selectAllCheck.checked;
            tbody.querySelectorAll('.movie-check').forEach(function (check) {
                check.checked = checked;
            });
        });

        tbody.addEventListener('change', function (event) {
            if (!event.target.classList || !event.target.classList.contains('movie-check')) {
                return;
            }
            const checks = tbody.querySelectorAll('.movie-check');
            const checked = tbody.querySelectorAll('.movie-check:checked');
            selectAllCheck.checked = checks.length > 0 && checks.length === checked.length;
        });

        async function saveMagnets(codes, button) {
            if (!codes || codes.length === 0) {
                exportResult.style.display = 'block';
                exportResult.innerHTML = '<span class="error-tip">请先勾选要导出的影片</span>';
                return;
            }
            const activeButton = button || exportBtn;
            const originalText = activeButton.textContent;
            activeButton.disabled = true;
            activeButton.textContent = '保存中...';
            try {
                const response = await fetch('/javdb/magnets/export', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(codes)
                });
                const result = await response.json();
                if (!result || result.success === false) {
                    throw new Error(result && result.message ? result.message : '接口返回失败');
                }
                const data = result.data || {};
                exportResult.style.display = 'block';
                exportResult.innerHTML = '已保存 ' + esc(data.magnetCount) + ' 条磁链、'
                        + esc(data.noMagnetCount) + ' 个无磁链番号，共 ' + esc(data.total)
                        + ' 部；已写入数据库表：' + esc(data.table);
            } catch (error) {
                console.error('保存磁链失败:', error);
                exportResult.style.display = 'block';
                exportResult.innerHTML = '<span class="error-tip">保存失败：' + esc(error.message) + '</span>';
            } finally {
                activeButton.disabled = false;
                activeButton.textContent = originalText;
            }
        }

        exportBtn.addEventListener('click', function () {
            saveMagnets(selectedCodes(), exportBtn);
        });

        tbody.addEventListener('click', function (event) {
            const button = event.target.closest ? event.target.closest('.row-export-btn') : null;
            if (!button) {
                return;
            }
            saveMagnets([button.getAttribute('data-code')], button);
        });

        let scrollTimer;
        container.addEventListener('scroll', function () {
            if (scrollTimer) clearTimeout(scrollTimer);
            scrollTimer = setTimeout(onScrollHandler, 120);
        });

        fetchPage(1);
    })();
</script>
</body>
</html>
