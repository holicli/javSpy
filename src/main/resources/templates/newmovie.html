<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新片无限滚动 · 电影管理</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f5f7fa;
            margin: 0;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        /* 头部样式 - 新增查询区域 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h2 {
            font-weight: 500;
            color: #1e293b;
            margin: 0;
            border-left: 5px solid #3b82f6;
            padding-left: 1rem;
        }

        .search-section {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .search-input {
            padding: 0.6rem 1rem;
            border: 1px solid #dde3e9;
            border-radius: 30px;
            width: 300px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        .search-btn {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s, transform 0.1s;
            border: 1px solid transparent;
        }

        .search-btn:hover {
            background: #2563eb;
        }

        .search-btn:active {
            transform: scale(0.97);
        }

        .clear-btn {
            background: #eef1f4;
            border: 1px solid #dde3e9;
            color: #4b5565;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .clear-btn:hover {
            background: #e2e8f0;
        }

        .table-wrapper {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: auto;
            max-height: 70vh;
            border: 1px solid #e9eef2;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
            table-layout: auto;
        }
        th {
            background: #f8fafd;
            color: #334155;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 1rem 0.8rem;
            white-space: nowrap;
            border-bottom: 1px solid #dde3e9;
            position: sticky;
            top: 0;
            background: #f1f5f9;
            z-index: 10;
        }
        td {
            padding: 1rem 0.8rem;
            border-bottom: 1px solid #edf2f6;
            color: #1e293b;
            font-size: 0.9rem;
            vertical-align: middle;
            transition: background 0.1s;
        }
        tr:hover td {
            background-color: #fafcff;
        }

        /* 封面列图片容器 - 修改以支持放大不被遮挡 */
        .cover-cell {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70px;
            width: 50px;
        }

        .cover-img {
            width: 50px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            display: block;
            position: relative;
            z-index: 1;
        }

        /* 修改悬浮放大效果 - 使用transform-origin和更高z-index确保不被遮挡 */
        .cover-img:hover {
            transform: scale(3);
            transform-origin: center center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            z-index: 9999;
            position: relative;
            border-radius: 8px;
            transition: transform 0.15s ease-out;
        }

        /* 演员、文字等长内容省略 */
        .text-ellipsis {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 标签样式 */
        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .badge-green {
            background: #e0f2e7;
            color: #0e6245;
        }
        .badge-gray {
            background: #eef1f4;
            color: #4b5565;
        }
        .exists-y {
            color: #0b7e43;
            font-weight: 500;
        }
        .exists-n {
            color: #b91c1c;
        }
        /* 下载按钮 */
        .download-btn {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 5px rgba(59,130,246,0.3);
            transition: background 0.15s, transform 0.1s;
            border: 1px solid transparent;
        }
        .download-btn:hover {
            background: #2563eb;
        }
        .download-btn:active {
            transform: scale(0.96);
        }
        /* 底部加载指示器 */
        .loading-indicator {
            text-align: center;
            padding: 1.2rem;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px dashed #d4dfe9;
            background: #f9fbfd;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #cbd5e1;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* 状态提示 */
        .error-tip {
            color: #b91c1c;
            background: #fee2e2;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            display: inline-block;
        }
        /* 空数据占位 */
        .empty-row td {
            padding: 3rem;
            text-align: center;
            color: #94a3b8;
        }
        footer {
            margin-top: 20px;
            color: #6b7b8f;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 搜索结果高亮 */
        .highlight {
            background-color: #fef9c3;
            transition: background-color 0.3s;
        }

        /* 详情页遮罩层 */
        .detail-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .detail-modal {
            background: white;
            border-radius: 20px;
            width: 90%;
            max-width: 1200px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalFadeIn 0.3s;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .close-detail {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            color: #64748b;
            cursor: pointer;
            transition: color 0.2s;
            z-index: 1;
            line-height: 1;
        }

        .close-detail:hover {
            color: #1e293b;
        }

        .detail-content {
            display: flex;
            flex-direction: column;
            padding: 2rem;
        }

        .detail-main {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .detail-left {
            flex: 0 0 300px;
        }

        .detail-poster {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .detail-right {
            flex: 1;
        }

        .detail-title {
            font-size: 2rem;
            font-weight: 600;
            color: #1e293b;
            margin: 0 0 0.5rem 0;
        }

        .detail-id {
            font-size: 1.1rem;
            color: #3b82f6;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #edf2f6;
        }

        .detail-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .info-item {
            background: #f8fafd;
            padding: 0.8rem 1rem;
            border-radius: 8px;
        }

        .info-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 0.2rem;
        }

        .info-value {
            font-size: 1rem;
            color: #1e293b;
            font-weight: 500;
        }

        .detail-links {
            margin-top: 1.5rem;
        }

        .links-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 1rem;
        }

        .links-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .links-list li {
            padding: 0.5rem 0;
            border-bottom: 1px dashed #edf2f6;
        }

        .links-list a {
            color: #3b82f6;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            word-break: break-all;
        }

        .links-list a:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        .links-list .link-type {
            font-size: 0.8rem;
            background: #eef1f4;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            color: #4b5565;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        /* 关键样式：限制文字显示10个字符后显示省略号 */
        .ellipsis-cell {
            max-width: 150px; /* 根据10个字符的实际宽度调整 */
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* 或者使用ch单位（1ch等于一个0字符的宽度）*/
        .ellipsis-cell-ch {
            max-width: 10ch; /* 限制10个字符宽度 */
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* 更精确的控制：使用表格布局 */
        .fixed-table {
            table-layout: fixed;
        }

        .fixed-table td {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* 为不同列设置不同宽度 */
        .fixed-table td:first-child {
            width: 120px;
        }

        .fixed-table td:nth-child(2) {
            width: 150px;
        }

        @media (max-width: 768px) {
            .detail-main {
                flex-direction: column;
            }
            .detail-left {
                flex: 0 0 auto;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 头部添加查询区域 -->
    <div class="header">
        <h2>新片无限滚动</h2>
        <div class="search-section">
            <input type="text" class="search-input" id="searchInput" placeholder="输入番号、标题或演员...">
            <button class="search-btn" id="searchBtn">
                <span>🔍</span> 查询
            </button>
            <button class="clear-btn" id="clearSearchBtn">清除</button>
        </div>
    </div>

    <div class="table-wrapper;fixed-tabl" id="scrollTableWrapper">
        <table>
            <thead>
            <tr>
                <th></th>
                <th></th>
                <th></th>
                <th>封面</th>
                <th>番号</th>
                <th>标题</th>
                <th>演员</th>
                <th>是否为单体作品</th>
                <th>推荐链接</th>
                <th>大小</th>
                <th>日期</th>
                <th>是否存在于Emby</th>
                <th>是否于下载列表</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="tableBody">
            <tr class="empty-row"><td colspan="12">加载中，请稍后...</td></tr>
            </tbody>
        </table>
        <!-- 底部加载区域 -->
        <div id="loadMoreTrigger" class="loading-indicator">
            <span class="spinner"></span> 加载更多...
        </div>
    </div>
    <footer>
        <span>⚡ 滚动至底部自动加载下一页 · 鼠标移到封面放大 · 点击图片查看详情</span>
        <span id="pageInfo">第 1 页</span>
    </footer>
</div>

<!-- 详情页遮罩层 -->
<div class="detail-overlay" id="detailOverlay">
    <div class="detail-modal">
        <span class="close-detail" id="closeDetail">&times;</span>
        <div class="detail-content" id="detailContent">
            <!-- 详情内容会动态填充 -->
        </div>
    </div>
</div>

<script>
    (function() {
        const BASE_URL = '';
        let currentPage = 1;
        let isLoading = false;
        let hasMore = true;
        let allMovies = [];
        let currentSearchTerm = ''; // 当前搜索关键词

        // DOM 元素
        const tbody = document.getElementById('tableBody');
        const loadMoreDiv = document.getElementById('loadMoreTrigger');
        const pageSpan = document.getElementById('pageInfo');
        const scrollContainer = document.getElementById('scrollTableWrapper');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const detailOverlay = document.getElementById('detailOverlay');
        const detailContent = document.getElementById('detailContent');
        const closeDetail = document.getElementById('closeDetail');

        // ---------- 辅助函数 ----------
        function formatExists(exists) {
            if (exists === true) return '<span class="exists-y">✅ 存在</span>';
            if (exists === false) return '<span class="exists-n">❌ 不存在</span>';
            return '<span class="exists-n">未知</span>';
        }

        function ellipsis(str, maxLen = 30) {
            if (!str) return '';
            return str.length > maxLen ? str.substr(0, maxLen) + '…' : str;
        }

        // 高亮搜索关键词
        function highlightText(text, term) {
            if (!term || !text) return text;
            try {
                const regex = new RegExp(`(${term})`, 'gi');
                return text.toString().replace(regex, '<span class="highlight">$1</span>');
            } catch (e) {
                return text;
            }
        }

        // 渲染下载按钮
        function renderDownloadButton(movie) {
            const identifier = movie.idNumber || movie.title || '未知';
            return `<button class="download-btn" data-movie='${JSON.stringify(movie).replace(/'/g, "&apos;")}' data-id="${identifier}">⬇️ 下载</button>`;
        }

        // 渲染电影行
        function renderMovieRow(movie) {
            const cover = movie.coverUrl || 'https://via.placeholder.com/50x70?text=No+Img';
            const idNumber = movie.idNumber || '—';
            const title = movie.title || '—';
            const actors = movie.actors || '—';
            const isSingle = movie.isSingle || '—';
            const linkUrl = movie.linkUrl ? (movie.linkUrl.length > 25 ? movie.linkUrl.substr(0, 22)+'…' : movie.linkUrl) : '—';
            const size = movie.size || '—';
            const date = movie.date || '—';
            const existsHtml = formatExists(movie.exists);
            const existsDownload = formatExists(movie.isDownload);
            const downloadBtn = renderDownloadButton(movie);

            // 应用搜索高亮
            const highlightedIdNumber = currentSearchTerm ? highlightText(idNumber, currentSearchTerm) : idNumber;
            const highlightedTitle = currentSearchTerm ? highlightText(title, currentSearchTerm) : title;
            const highlightedActors = currentSearchTerm ? highlightText(actors, currentSearchTerm) : actors;

            return `<tr>
                <td></td>
                <td></td>
                <td></td>
                <td class="cover-cell">
                    <img src="${cover}" alt="cover" class="cover-img" loading="lazy" data-movie-id="${movie.idNumber || ''}" data-movie-detail='${JSON.stringify(movie).replace(/'/g, "&apos;")}' onerror="this.src='https://via.placeholder.com/50x70?text=Error'">
                </td>
                <td>${highlightedIdNumber}</td>
                <td>${highlightedTitle}</td>
                <td><span class="text-ellipsis" title="${(actors || '').replace(/"/g, '&quot;')}">${highlightedActors}</span></td>
                <td>${ellipsis(isSingle, 10)}</td>
                <td><a href="${movie.linkUrl || '#'}" target="_blank" title="${movie.linkUrl || ''}">${linkUrl}</a></td>
                <td>${size}</td>
                <td>${date}</td>
                <td>${existsHtml}</td>
                <td>${existsDownload}</td>
                <td>${downloadBtn}</td>
            </tr>`;
        }

        // 渲染详情页面
        function renderDetailPage(movie) {
            if (!movie) return '';

            const cover = movie.coverUrl || 'https://via.placeholder.com/300x400?text=No+Image';

            return `
                <div class="detail-main">
                    <div class="detail-left">
                        <img src="${cover}" alt="${movie.title || '电影封面'}" class="detail-poster">
                    </div>
                    <div class="detail-right">
                        <h1 class="detail-title">${movie.title || '无标题'}</h1>
                        <div class="detail-id">番号：${movie.idNumber || '无'}</div>

                        <div class="detail-info-grid">
                            <div class="info-item">
                                <div class="info-label">演员</div>
                                <div class="info-value">${movie.actors || '未知'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">是否为单体作品</div>
                                <div class="info-value">${movie.isSingle || '未知'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">大小</div>
                                <div class="info-value">${movie.size || '未知'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">日期</div>
                                <div class="info-value">${movie.date || '未知'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Emby状态</div>
                                <div class="info-value">${formatExists(movie.exists)}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">下载列表</div>
                                <div class="info-value">${formatExists(movie.isDownload)}</div>
                            </div>
                        </div>

                        <div class="detail-links">
                            <div class="links-title">🔗 相关链接</div>
                            <ul class="links-list">
                                ${movie.linkUrl ? `<li><span class="link-type">推荐链接</span><a href="${movie.linkUrl}" target="_blank">${movie.linkUrl}</a></li>` : ''}
                                ${movie.downloadLinks && Array.isArray(movie.downloadLinks) ? movie.downloadLinks.map(link => `
                                    <li><span class="link-type">下载链接</span><a href="${link.url || link}" target="_blank">${link.name || link}</a></li>
                                `).join('') : ''}
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        // 批量追加渲染
        function appendMovies(movies) {
            if (!movies || movies.length === 0) {
                hasMore = false;
                loadMoreDiv.style.display = 'none';
                return;
            }

            const emptyRow = tbody.querySelector('.empty-row');
            if (emptyRow) tbody.innerHTML = '';

            let htmlRows = '';
            movies.forEach(m => {
                htmlRows += renderMovieRow(m);
            });
            tbody.insertAdjacentHTML('beforeend', htmlRows);
        }

        // 清除搜索高亮并重置数据
        function resetSearch() {
            currentSearchTerm = '';
            searchInput.value = '';
            resetAndLoadFirst();
        }

        // 执行搜索
        function performSearch() {
            const searchTerm = searchInput.value.trim();
            if (!searchTerm) {
                resetSearch();
                return;
            }

            currentSearchTerm = searchTerm;
            resetAndLoadFirst();
        }

        // 重置状态并加载第一页
        function resetAndLoadFirst() {
            currentPage = 1;
            hasMore = true;
            allMovies = [];
            tbody.innerHTML = '<tr class="empty-row"><td colspan="12">加载中，请稍后...</td></tr>';
            loadMoreDiv.style.display = 'flex';
            loadMoreDiv.innerHTML = `<span class="spinner"></span> 加载更多...`;
            fetchPage(currentPage);
        }

        // 请求接口
        async function fetchPage(page) {
            if (isLoading || !hasMore) return;

            isLoading = true;
            loadMoreDiv.innerHTML = `<span class="spinner"></span> 正在加载第 ${page} 页...`;

            try {
                const sizeParam = '10';
                let url = `${BASE_URL}/getNewMovie?page=${page}&size=${sizeParam}`;

                // 如果有搜索关键词，添加到请求中
                if (currentSearchTerm) {
                    url += `&keyword=${encodeURIComponent(currentSearchTerm)}`;
                }

                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }

                const result = await response.json();

                let movies = [];
                if (result && Array.isArray(result.data?.list)) {
                    movies = result.data.list;
                } else if (Array.isArray(result)) {
                    movies = result;
                } else if (result && Array.isArray(result.data)) {
                    movies = result.data;
                } else {
                    console.warn('接口返回格式异常', result);
                    movies = [];
                }

                pageSpan.innerText = `第 ${page} 页${currentSearchTerm ? ' · 搜索: ' + currentSearchTerm : ''}`;

                if (movies.length === 0) {
                    hasMore = false;
                    loadMoreDiv.innerHTML = `🏁 没有更多电影了`;
                    if (page === 1 && tbody.children.length === 1) {
                        tbody.innerHTML = '<tr class="empty-row"><td colspan="12">暂无电影数据</td></tr>';
                    }
                } else {
                    appendMovies(movies);
                    allMovies = [...allMovies, ...movies];

                    if (movies.length < 10) {
                        hasMore = false;
                        loadMoreDiv.innerHTML = `🏁 已加载全部 (共 ${allMovies.length} 条)`;
                    } else {
                        loadMoreDiv.innerHTML = `⬇️ 向下滚动加载更多...`;
                    }
                }

            } catch (error) {
                console.error('获取电影列表失败:', error);
                loadMoreDiv.innerHTML = `<span class="error-tip">⚠️ 加载失败，<a href="javascript:void(0)" onclick="window.location.reload()">重试</a></span>`;
                if (page === 1) {
                    tbody.innerHTML = `<tr class="empty-row"><td colspan="12">加载失败，请刷新页面</td></tr>`;
                }
            } finally {
                isLoading = false;
            }
        }

        // 滚动触发加载
        function onScrollHandler() {
            if (!hasMore || isLoading) return;

            const container = scrollContainer;
            const scrollBottom = container.scrollHeight - container.scrollTop - container.clientHeight;
            if (scrollBottom < 40) {
                currentPage++;
                fetchPage(currentPage);
            }
        }

        // 事件监听
        let scrollTimer;
        scrollContainer.addEventListener('scroll', () => {
            if (scrollTimer) clearTimeout(scrollTimer);
            scrollTimer = setTimeout(onScrollHandler, 100);
        });

        // 搜索功能
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
        clearSearchBtn.addEventListener('click', resetSearch);

        // 关闭详情页
        closeDetail.addEventListener('click', () => {
            detailOverlay.style.display = 'none';
        });

        detailOverlay.addEventListener('click', (e) => {
            if (e.target === detailOverlay) {
                detailOverlay.style.display = 'none';
            }
        });

        // 图片点击显示详情 - 使用事件委托
        tbody.addEventListener('click', (e) => {
            const img = e.target.closest('.cover-img');
            if (img) {
                const movieStr = img.getAttribute('data-movie-detail');
                if (movieStr) {
                    try {
                        const movie = JSON.parse(movieStr);
                        detailContent.innerHTML = renderDetailPage(movie);
                        detailOverlay.style.display = 'flex';
                    } catch (err) {
                        console.error('解析电影详情失败:', err);
                    }
                }
            }
        });

        // 下载按钮点击
        tbody.addEventListener('click', (e) => {
            const btn = e.target.closest('.download-btn');
            if (!btn) return;

            const movieStr = btn.getAttribute('data-movie');
            let movie;
            try {
                movie = JSON.parse(movieStr);
            } catch (err) {
                console.warn('解析movie数据失败', movieStr);
                alert('无法获取电影信息');
                return;
            }

            const downloadApi = `${BASE_URL}/startDownload`;

            fetch(downloadApi, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    idNumber: movie.idNumber,
                    title: movie.title,
                    linkUrl: movie.linkUrl
                })
            })
                .then(res => {
                    if (!res.ok) throw new Error(`下载请求失败 ${res.status}`);
                    return res.text().then(text => {
                        try { return JSON.parse(text); } catch { return text; }
                    });
                })
                .then(data => {
                    alert(`⏳ 下载任务已提交: ${movie.title || '电影'}`);
                    console.log('下载接口响应', data);
                })
                .catch(err => {
                    console.error('下载错误', err);
                    alert('下载调用失败，请查看控制台');
                });

            e.preventDefault();
        });

        // 检查是否需要自动加载更多
        function checkAndLoadMoreIfNeeded() {
            if (!hasMore || isLoading) return;
            const container = scrollContainer;
            if (container.scrollHeight <= container.clientHeight + 40) {
                currentPage++;
                fetchPage(currentPage);
            }
        }

        // 监听表格变化
        const observer = new MutationObserver(() => {
            setTimeout(checkAndLoadMoreIfNeeded, 200);
        });
        observer.observe(tbody, { childList: true, subtree: true });

        // 启动
        resetAndLoadFirst();

        // 添加ESC键关闭详情
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && detailOverlay.style.display === 'flex') {
                detailOverlay.style.display = 'none';
            }
        });
    })();
</script>
</body>
</html>
