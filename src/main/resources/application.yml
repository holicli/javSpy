spring:
    # 应用名（日志/监控用）
    application:
        name: javspy

    # Redis：MyBatis 缓存 / ShedLock 分布式锁 / RedisTemplate 使用
    redis:
        host: 127.0.0.1

    # 数据库：驱动为 mariadb-java-client（与 pom 中依赖一致）
    datasource:
        driver-class-name: org.mariadb.jdbc.Driver
        url: jdbc:mariadb://192.168.0.108:33306/javspy
        username: root
        password: 123456
        hikari:
            maximum-pool-size: 500
            minimum-idle: 5
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000
            pool-name: MyAppHikariCP
            connection-test-query: SELECT 1

server:
    port: 8084

mybatis-plus:
    mapper-locations: classpath*:**/mapping/*.xml
    configuration:
        # 查询结果按列名映射到驼峰属性（cover_url -> coverUrl）
        map-underscore-to-camel-case: true
        # 列为 NULL 时也调用 setter（列表展示依赖该行为判断"无数据"）
        call-setters-on-nulls: true
        auto-mapping-unknown-column-behavior: warning
        # 控制台打印 SQL；生产环境建议改为 nologging.NoLoggingImpl 或 slf4j
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
        banner: false

conf:
    image:
        # 图片存储目录（相对路径基于应用启动目录）；服务器上建议用绝对路径
        storage-path: ../pic

    emby:
        # 关闭后不查 Emby，也不做影片存在性标记
        enabled: true
        serverUrl: http://192.168.0.108:28096
        apiKey: bd87f9a3632e4e409314ae45f71d99db

    javbus-api:
        # 自托管 javbus-api 服务地址
        base-url: http://192.168.0.108:33000
        # 服务端开启权限校验时使用 j-auth-token 请求头
        token: ""
        # 代理总开关：javbus-api 为局域网服务可直连；下载 javbus 封面/头像需要代理时打开
        proxy-enabled: true
        proxy-host: 127.0.0.1
        proxy-port: 7890
        # 单次请求超时（毫秒）
        timeout-ms: 20000
        # 两次请求间隔（毫秒），避免请求过快
        request-interval-ms: 300
        # 影片总数短时缓存（毫秒）：列表翻页时避免重复 COUNT，0 表示关闭
        count-cache-ms: 5000
        # 是否打印返回的 JSON 到控制台（调试用）
        print-json: false
